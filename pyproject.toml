[project]
authors = [
    {name = "Nail", email = "nn@io.org"},
]
requires-python = "<4.0,>=3.10"
name = "hexlet-code"
version = "0.1.0"
description = "find differences between two files"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0.2",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.1",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]
